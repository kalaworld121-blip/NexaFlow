<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — NexaFlow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <a
                href="index.html"
                class="auth-logo"
            >
                NexaFlow
            </a>


            <div class="auth-card">

                <div class="auth-header">

                    <h1>
                        Welcome back
                    </h1>

                    <p>
                        Login to your NexaFlow account
                    </p>

                </div>


                <form
                    id="loginForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a
                            href="#"
                            class="forgot-password"
                            id="forgotPassword"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Login →
                    </button>

                </form>


                <div class="auth-footer">

                    <p>

                        Don't have an account?

                        <a href="signup.html">
                            Sign Up
                        </a>

                    </p>

                </div>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to NexaFlow
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
