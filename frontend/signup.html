<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up — NexaFlow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <a
                href="index.html"
                class="auth-logo"
            >
                NexaFlow
            </a>


            <div class="auth-card">

                <div class="auth-header">

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Start your smarter workflow with NexaFlow
                    </p>

                </div>


                <form
                    id="signupForm"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            name="name"
                            placeholder="Your full name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="terms-group">

                        <label class="checkbox-label">

                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                            >

                            <span>
                                I agree to the NexaFlow
                                Terms & Privacy Policy
                            </span>

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Create Account →
                    </button>

                </form>


                <div class="auth-footer">

                    <p>

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>


            <a
                href="index.html"
                class="back-link"
            >
                ← Back to NexaFlow
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
